services:
  backend1:
    image: nginx
    volumes:
      - ./backend1/index.html:/usr/share/nginx/html/index.html:ro

  backend2:
    image: nginx
    volumes:
      - ./backend2/index.html:/usr/share/nginx/html/index.html:ro

  postgres:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testdb

  nginx:
    image: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
